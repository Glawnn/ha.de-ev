[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-de-ev"
version = "0.3.0"
description = "Home Assistant integration for a locally controlled Tuya EV charger."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["tinytuya>=1.20.0"]

[project.optional-dependencies]
dev = [
  "pytest-homeassistant-custom-component==0.13.373",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.de_ev" = ["frontend/*.js", "translations/*.json"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
